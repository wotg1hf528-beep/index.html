<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>متجر GBN</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1220; --card:#181c30; --card2:#1f243d; --text:#eef0ff; --muted:#9aa1c7;
    --brand:#6c5ce7; --brand2:#00cec9; --danger:#ff6b6b; --ok:#2ecc71; --border:#2a3050;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:0}
  header{position:sticky;top:0;z-index:20;background:rgba(15,18,32,.9);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);padding:12px 5%;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{font-weight:800;font-size:1.6rem;background:linear-gradient(90deg,var(--brand),var(--brand2));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  nav{display:flex;gap:6px;margin-inline-start:10px}
  nav button{background:transparent;color:var(--muted);padding:8px 14px;border-radius:10px;font-weight:600}
  nav button.active,nav button:hover{background:var(--card2);color:var(--text)}
  .spacer{flex:1}
  .btn{padding:10px 18px;border-radius:12px;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--brand),#8e7bff);transition:.2s}
  .btn:hover{transform:translateY(-1px);filter:brightness(1.1)}
  .btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--border)}
  .btn.danger{background:var(--danger)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .gbtn{display:flex;align-items:center;gap:10px;background:#fff;color:#222}
  .gbtn svg{width:18px;height:18px}
  .user{display:flex;align-items:center;gap:10px}
  .user img{width:38px;height:38px;border-radius:50%;border:2px solid var(--brand)}
  .badge{font-size:.72rem;padding:3px 10px;border-radius:20px;background:var(--card2);border:1px solid var(--border);color:var(--brand2);font-weight:700}
  .badge.pro{color:#ffd166;border-color:#ffd166}
  .badge.business{color:#ff9ff3;border-color:#ff9ff3}
  main{padding:24px 5% 60px;max-width:1300px;margin:auto}
  .hero{text-align:center;padding:40px 0 24px}
  .hero h1{font-size:clamp(1.8rem,5vw,3rem);font-weight:800}
  .hero p{color:var(--muted);margin-top:8px}
  .search{display:flex;gap:10px;max-width:520px;margin:20px auto 0}
  input,textarea,select{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);
    padding:12px 14px;border-radius:12px;font-family:inherit;font-size:1rem;outline:none}
  input:focus,textarea:focus{border-color:var(--brand)}
  label{display:block;margin:12px 0 6px;color:var(--muted);font-size:.9rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;margin-top:26px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden;transition:.2s;display:flex;flex-direction:column}
  .card:hover{transform:translateY(-4px);border-color:var(--brand)}
  .card .img{aspect-ratio:4/3;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:3rem;overflow:hidden}
  .card .img img{width:100%;height:100%;object-fit:cover}
  .card .body{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
  .card h3{font-size:1.05rem}
  .card .desc{color:var(--muted);font-size:.88rem;flex:1}
  .price{font-weight:800;color:var(--brand2);font-size:1.1rem}
  .seller{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.8rem;margin-top:6px}
  .seller img{width:22px;height:22px;border-radius:50%}
  .empty{text-align:center;color:var(--muted);padding:60px 0}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;max-width:560px;margin:20px auto}
  .panel h2{margin-bottom:6px}
  .quota{background:var(--card2);border-radius:12px;padding:10px 14px;margin:10px 0;color:var(--muted);font-size:.9rem}
  .plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:26px}
  .plan{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:10px}
  .plan.featured{border:2px solid var(--brand);box-shadow:0 0 30px rgba(108,92,231,.25)}
  .plan h3{font-size:1.3rem}
  .plan .p{font-size:2rem;font-weight:800}
  .plan .p small{font-size:.9rem;color:var(--muted);font-weight:400}
  .plan ul{list-style:none;color:var(--muted);flex:1;display:grid;gap:8px;margin:8px 0}
  .plan li::before{content:"✓ ";color:var(--ok);font-weight:700}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--border);
    padding:12px 22px;border-radius:14px;z-index:99;opacity:0;pointer-events:none;transition:.3s}
  .toast.show{opacity:1}
  .hidden{display:none!important}
  footer{text-align:center;color:var(--muted);padding:30px;font-size:.85rem;border-top:1px solid var(--border)}
</style>
</head>
<body>

<header>
  <div class="logo">GBN</div>
  <nav>
    <button id="nav-shop" class="active">المتجر</button>
    <button id="nav-add">أضف منتج</button>
    <button id="nav-mine">منتجاتي</button>
    <button id="nav-plans">الاشتراكات</button>
  </nav>
  <div class="spacer"></div>

  <button id="loginBtn" class="btn gbtn">
    <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.5 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.8c4.3-4 6.9-9.9 6.9-17.2z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.3.8-4.7l-7.9-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.8c-2.1 1.4-4.9 2.3-8.5 2.3-6.3 0-11.6-4-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
    تسجيل الدخول بجوجل
  </button>
  <div id="userBox" class="user hidden">
    <span id="planBadge" class="badge">مجاني</span>
    <img id="userPhoto" alt="">
    <span id="userName"></span>
    <button id="logoutBtn" class="btn ghost">خروج</button>
  </div>
</header>

<main>
  <!-- المتجر -->
  <section id="view-shop">
    <div class="hero">
      <h1>متجر GBN 🛍️</h1>
      <p>منتجات يضيفها المستخدمون — تصفّح أو اعرض منتجك الآن</p>
      <div class="search"><input id="searchInput" placeholder="ابحث عن منتج..."></div>
    </div>
    <div id="shopGrid" class="grid"></div>
  </section>

  <!-- إضافة منتج -->
  <section id="view-add" class="hidden">
    <div class="panel">
      <h2>إضافة منتج جديد</h2>
      <div class="quota" id="quotaBox"></div>
      <form id="productForm">
        <label>اسم المنتج</label>
        <input id="pName" required maxlength="80">
        <label>السعر (د.ع)</label>
        <input id="pPrice" type="number" min="0" required>
        <label>الوصف</label>
        <textarea id="pDesc" rows="3" maxlength="400"></textarea>
        <label>صورة المنتج (ارفع صورة)</label>
        <input id="pFile" type="file" accept="image/*">
        <label>أو رابط صورة</label>
        <input id="pUrl" type="url" placeholder="https://...">
        <label>رقم التواصل (واتساب/هاتف)</label>
        <input id="pContact" maxlength="30">
        <br><br>
        <button class="btn" id="saveBtn" style="width:100%">نشر المنتج</button>
      </form>
    </div>
  </section>

  <!-- منتجاتي -->
  <section id="view-mine" class="hidden">
    <div class="hero"><h1>منتجاتي</h1></div>
    <div id="mineGrid" class="grid"></div>
  </section>

  <!-- الاشتراكات -->
  <section id="view-plans" class="hidden">
    <div class="hero">
      <h1>خطط الاشتراك 💎</h1>
      <p>اعرض عدداً أكبر من المنتجات مع الاشتراك المدفوع</p>
    </div>
    <div class="plans" id="plansBox"></div>
  </section>
</main>

<footer>© GBN Store — جميع الحقوق محفوظة</footer>
<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, where, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

/* ===== إعدادات Firebase ===== */
const firebaseConfig = {
  apiKey: "AIzaSyDpr667k3YoVLAusV9FcuMssENXUbbdzME",
  authDomain: "surfers-store.firebaseapp.com",
  projectId: "surfers-store",
  storageBucket: "surfers-store.firebasestorage.app",
  messagingSenderId: "774718355452",
  appId: "1:774718355452:web:e2303b1c4ff36b7d67e479",
  measurementId: "G-XW80046DYJ"
};
const app = initializeApp(firebaseConfig);
try { getAnalytics(app); } catch (e) {}
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

/* ===== خطط الاشتراك =====
   ضع روابط الدفع (Stripe Payment Links مثلاً) هنا بدل الروابط الوهمية */
const PLANS = {
  free:     { name: "مجاني",  price: 0,  limit: 3,        link: null },
  pro:      { name: "برو",    price: 5,  limit: 50,       link: "https://buy.stripe.com/REPLACE_PRO" },
  business: { name: "بزنس",   price: 15, limit: Infinity, link: "https://buy.stripe.com/REPLACE_BUSINESS" }
};

/* ===== الحالة ===== */
let user = null;
let userPlan = "free";
let allProducts = [];
let myCount = 0;
let unsubMine = null, unsubPlan = null;

const $ = id => document.getElementById(id);
const toast = msg => { const t=$("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2800); };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ===== التنقل ===== */
const views = ["shop","add","mine","plans"];
function show(v){
  views.forEach(x => {
    $("view-"+x).classList.toggle("hidden", x!==v);
    $("nav-"+x).classList.toggle("active", x===v);
  });
  if (v==="add") updateQuota();
}
views.forEach(v => $("nav-"+v).onclick = () => {
  if ((v==="add"||v==="mine") && !user){ toast("سجّل الدخول بجوجل أولاً"); return; }
  show(v);
});

/* ===== تسجيل الدخول بجوجل ===== */
$("loginBtn").onclick = async () => {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); toast("تم تسجيل الدخول ✅"); }
  catch (e) { toast("تعذّر تسجيل الدخول: " + (e.code || e.message)); }
};
$("logoutBtn").onclick = () => signOut(auth);

onAuthStateChanged(auth, u => {
  user = u;
  unsubMine && unsubMine(); unsubPlan && unsubPlan();
  userPlan = "free"; myCount = 0;

  $("loginBtn").classList.toggle("hidden", !!u);
  $("userBox").classList.toggle("hidden", !u);

  if (u){
    $("userPhoto").src = u.photoURL || "";
    $("userName").textContent = u.displayName || u.email;

    // الاشتراك: يُقرأ من users/{uid} ويكتبه الخادم فقط (بعد الدفع)
    unsubPlan = onSnapshot(doc(db,"users",u.uid), snap => {
      const p = snap.exists() ? snap.data().plan : "free";
      userPlan = PLANS[p] ? p : "free";
      renderPlanBadge(); renderPlans(); updateQuota();
    }, () => { renderPlanBadge(); renderPlans(); });

    unsubMine = onSnapshot(query(collection(db,"products"), where("ownerId","==",u.uid)), snap => {
      const items = snap.docs.map(d => ({id:d.id, ...d.data()}));
      myCount = items.length;
      renderGrid($("mineGrid"), items, true);
      updateQuota();
    });
  } else {
    renderGrid($("mineGrid"), [], true);
    show("shop");
  }
  renderPlanBadge(); renderPlans();
});

function renderPlanBadge(){
  const b = $("planBadge");
  b.textContent = PLANS[userPlan].name;
  b.className = "badge " + userPlan;
}

/* ===== المنتجات ===== */
onSnapshot(collection(db,"products"), snap => {
  allProducts = snap.docs.map(d => ({id:d.id, ...d.data()}))
    .sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
  filterShop();
}, err => toast("خطأ في تحميل المنتجات: " + err.code));

function renderGrid(el, items, mine){
  if (!items.length){
    el.innerHTML = `<div class="empty" style="grid-column:1/-1">${mine ? "لم تضف أي منتج بعد" : "لا توجد منتجات بعد — كن أول من يضيف منتجاً! 🚀"}</div>`;
    return;
  }
  el.innerHTML = items.map(p => `
    <div class="card">
      <div class="img">${p.image ? `<img src="${esc(p.image)}" alt="" loading="lazy">` : "📦"}</div>
      <div class="body">
        <h3>${esc(p.name)}</h3>
        <div class="desc">${esc(p.description)}</div>
        <div class="price">${Number(p.price).toLocaleString("ar-IQ")} د.ع</div>
        <div class="seller">${p.ownerPhoto ? `<img src="${esc(p.ownerPhoto)}" alt="">` : ""}${esc(p.ownerName)}</div>
        ${p.contact ? `<a class="btn" style="text-align:center;margin-top:8px" href="https://wa.me/${esc(String(p.contact).replace(/\D/g,''))}" target="_blank" rel="noopener">تواصل مع البائع</a>` : ""}
        ${mine ? `<button class="btn danger" data-del="${p.id}" style="margin-top:8px">حذف</button>` : ""}
      </div>
    </div>`).join("");
  if (mine) el.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (!confirm("حذف المنتج؟")) return;
    try { await deleteDoc(doc(db,"products",b.dataset.del)); toast("تم الحذف"); }
    catch(e){ toast("لا تملك صلاحية الحذف"); }
  });
}

function filterShop(){
  const q = $("searchInput").value.trim().toLowerCase();
  renderGrid($("shopGrid"), allProducts.filter(p =>
    !q || (p.name||"").toLowerCase().includes(q) || (p.description||"").toLowerCase().includes(q)), false);
}
$("searchInput").oninput = filterShop;

function updateQuota(){
  const lim = PLANS[userPlan].limit;
  $("quotaBox").innerHTML = lim === Infinity
    ? `خطتك <b>${PLANS[userPlan].name}</b>: منتجات غير محدودة`
    : `خطتك <b>${PLANS[userPlan].name}</b>: استخدمت ${myCount} من ${lim} منتجات`
      + (myCount >= lim ? ` — <a href="#" id="upLink" style="color:var(--brand2)">رقِّ اشتراكك</a>` : "");
  const up = $("upLink"); if (up) up.onclick = e => { e.preventDefault(); show("plans"); };
}

$("productForm").onsubmit = async e => {
  e.preventDefault();
  if (!user) return toast("سجّل الدخول أولاً");
  if (myCount >= PLANS[userPlan].limit){ toast("وصلت لحد خطتك — رقِّ اشتراكك"); return show("plans"); }

  const btn = $("saveBtn"); btn.disabled = true; btn.textContent = "جارٍ النشر...";
  try {
    let image = $("pUrl").value.trim();
    const file = $("pFile").files[0];
    if (file){
      if (file.size > 5*1024*1024) throw new Error("حجم الصورة أكبر من 5MB");
      const r = ref(storage, `products/${user.uid}/${Date.now()}_${file.name}`);
      await uploadBytes(r, file);
      image = await getDownloadURL(r);
    }
    await addDoc(collection(db,"products"), {
      name: $("pName").value.trim(),
      price: Number($("pPrice").value),
      description: $("pDesc").value.trim(),
      contact: $("pContact").value.trim(),
      image,
      ownerId: user.uid,
      ownerName: user.displayName || "مستخدم",
      ownerPhoto: user.photoURL || "",
      createdAt: serverTimestamp()
    });
    e.target.reset(); toast("تم نشر المنتج ✅"); show("shop");
  } catch (err) { toast("خطأ: " + (err.message || err.code)); }
  btn.disabled = false; btn.textContent = "نشر المنتج";
};

/* ===== الاشتراكات ===== */
function renderPlans(){
  const feats = {
    free: ["حتى 3 منتجات","ظهور في المتجر","دعم أساسي"],
    pro: ["حتى 50 منتج","أولوية في الدعم","شارة برو ⭐"],
    business: ["منتجات غير محدودة","أولوية قصوى","شارة بزنس 💎"]
  };
  $("plansBox").innerHTML = Object.entries(PLANS).map(([k,p]) => `
    <div class="plan ${k==="pro"?"featured":""}">
      <h3>${p.name}</h3>
      <div class="p">$${p.price}<small> / شهر</small></div>
      <ul>${feats[k].map(f=>`<li>${f}</li>`).join("")}</ul>
      ${k===userPlan && user
        ? `<button class="btn ghost" disabled>خطتك الحالية</button>`
        : p.link ? `<button class="btn" data-plan="${k}">اشترك الآن</button>`
                 : `<button class="btn ghost" disabled>الخطة الافتراضية</button>`}
    </div>`).join("");
  document.querySelectorAll("[data-plan]").forEach(b => b.onclick = () => subscribe(b.dataset.plan));
}

function subscribe(planKey){
  if (!user) return toast("سجّل الدخول بجوجل أولاً");
  const link = PLANS[planKey].link;
  if (!link || link.includes("REPLACE_")) return toast("لم يتم ربط رابط الدفع بعد — ضعه في إعدادات PLANS");
  // نمرّر uid ليعرف الخادم أي مستخدم دفع
  const url = new URL(link);
  url.searchParams.set("client_reference_id", user.uid);
  url.searchParams.set("prefilled_email", user.email || "");
  window.location.href = url.toString();
}

renderPlans();
renderGrid($("mineGrid"), [], true);
</script>
</body>
</html>
